<svg xmlns='http://www.w3.org/2000/svg' width='940' height='260' viewBox='0 0 940 260' role='img'><title>Exp 3: outcomes per system (12 end-to-end windows)</title><desc>G0: safe_completion 75.0%, justified_escalation 0.0%, unnecessary_deferral 8.3%, refusal 0.0%, unsafe_execution 16.7%; G1: safe_completion 79.2%, justified_escalation 8.3%, unnecessary_deferral 12.5%, refusal 0.0%, unsafe_execution 0.0%; G3: safe_completion 54.2%, justified_escalation 4.2%, unnecessary_deferral 37.5%, refusal 4.2%, unsafe_execution 0.0%</desc><rect width='940' height='260' fill='#fcfcfb'/><text x='20.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Exp 3: outcomes per system (12 end-to-end windows)</text><rect x='20' y='50' width='12' height='12' rx='2' fill='#2a78d6'/><text x='38.0' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>safe completion</text><rect x='158.0' y='50' width='12' height='12' rx='2' fill='#eb6834'/><text x='176.0' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>justified escalation</text><rect x='332.0' y='50' width='12' height='12' rx='2' fill='#1baf7a'/><text x='350.0' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>unnecessary deferral</text><rect x='506.0' y='50' width='12' height='12' rx='2' fill='#eda100'/><text x='524.0' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>refusal</text><rect x='586.4' y='50' width='12' height='12' rx='2' fill='#e87ba4'/><text x='604.4' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>unsafe execution</text><text x='20.0' y='82.0' font-family='Helvetica, Arial, sans-serif' font-size='11