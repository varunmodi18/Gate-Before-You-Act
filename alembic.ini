# Alembic configuration for data/app.db (plan T0.2). The database URL is set by
# gbya.store.db (from config/app.yaml / GBYA_APP_DB_PATH); the value below is only a fallback.
[alembic]
script_location = %(here)s/backend/gbya/store/migrations
prepend_sys_path = %(here)s/backend
path_separator = os
sqlalchemy.url = sqlite:///data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
