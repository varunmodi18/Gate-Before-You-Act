# Experiment 2: agent episodes from a frozen investigation prefix (plan §A.1, §D.6.4, §D.10, T5.4).
# Configuration only: the runner interprets it and contains no system logic (§C.4).
experiment: 2

# Run schedule (A-4): one schedule for every Exp 2 and Exp 3 system; the verifier uses
# temperature 0. Single-run systems use run 1.
schedule:
  1: {temperature: 0.2, seed: 11}
  2: {temperature: 0.5, seed: 22}
  3: {temperature: 0.7, seed: 33}

# System -> number of runs (§D.6.4). A8 arrives with T5.8; until it is in gate/configs.yaml a run
# of this default configuration is refused (UNKNOWN_SYSTEM).
systems: {G0: 3, G1: 3, G3: 3, G2: 1, A1: 1, A5: 1, A7: 1, A8: 1}

# Set to F1 (experiments/fallbacks.yaml) when the budget requires it (T0.3, T5.5).
fallback: null
